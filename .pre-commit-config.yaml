# Hooks deliberately invoke the same pnpm scripts that CI runs
# (.github/workflows/ci.yml) so local commits and CI cannot disagree.
repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        description: Validate commit message against Conventional Commits.
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: true

      - id: lint
        name: lint (pnpm lint)
        description: ESLint over the whole repo (same command as CI).
        entry: pnpm lint
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: typecheck
        name: typecheck (pnpm typecheck)
        description: tsc -b project type-check (the type-check half of the build).
        entry: pnpm typecheck
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: test
        name: test (pnpm test)
        description: Vitest unit tests (same command as CI).
        entry: pnpm test
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
