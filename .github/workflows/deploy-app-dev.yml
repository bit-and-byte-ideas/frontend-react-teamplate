name: Deploy App (dev)

# Deploys main to the DEV Azure Static Web App.
# Needs, in the GitHub environment `dev` (Settings -> Environments):
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN  deployment token of the dev Static Web App
#   variable SITE_URL                         public URL of the dev site (optional)
on:
  push:
    branches: [main]
  # Manual runs let a feature branch deploy to dev for a real-URL check before merging.
  workflow_dispatch:

# Azure authenticates with its own token, so the job only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: deploy-app-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Environment-scoped secret: dev and prod are different Static Web Apps with different
    # deployment tokens, so the token lives in the environment, never at repository level.
    environment:
      name: dev
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version is read from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (lint, build, unit tests)
        env:
          # Optional: read it in the app as import.meta.env.VITE_SITE_URL (canonical/OG URLs).
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          pnpm lint
          pnpm build
          pnpm test

      # Dev serves the same pages as prod; keep it out of search indexes.
      - name: Mark build as noindex
        run: node scripts/add-noindex-header.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
